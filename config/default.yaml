# Settings for testing Samsung Browser / Samsung Internet for Windows. Layers, later wins:
#   default.yaml < local.yaml < environment variables (SB_*) < CLI flags
# Machine-specific paths go to config/local.yaml (git-ignored), see local.example.yaml.

browser:
  # Path to SamsungInternet.exe - set it in config/local.yaml (env: SB_EXE, flag: --exe)
  exe: ""
  # We start the exe with --remote-debugging-port and Playwright attaches to it over DevTools:
  # no driver binary, nothing to match with the build's Chromium version.
  headless: false
  # The browser starts without a window (the command line cannot open chrome:// pages) and
  # its first window opens directly on a page - no about:blank before it, Back is off:
  #   start_page set -> on that page right after the start (nothing waits for it to load):
  #                     a `pages` name (history, bookmarks...) or a URL
  #   ""             -> on the page of the test's first web.open / pages.x.open; a native
  #                     step before any page opens it on the home page (newtab)
  # Samsung cuts DevTools off a tab that leaves its home page: the framework attaches again
  # by itself (same tab). Per test: browser(start_page=...).
  start_page: ""
  window_size: [1400, 900]
  # Extra command line switches for the browser.
  args:
    - --no-first-run
    - --no-default-browser-check
    - --disable-background-networking
    - --disable-component-update
    - --disable-sync
    - --password-store=basic
    - --lang=en-US
    # keep rendering while other windows cover the browser: otherwise Chromium marks the page
    # hidden and internal pages render no rows (several --disable-features are merged into one)
    - --disable-backgrounding-occluded-windows
    - --disable-features=CalculateNativeWinOcclusion
  # Preferences merged into Default/Preferences of every fresh profile.
  prefs:
    intl.accept_languages: en-US,en
    download.prompt_for_download: false
    download.directory_upgrade: true
    safebrowsing.enabled: false
    credentials_enable_service: false
    profile.password_manager_enabled: false
  # Keep the profile folder after the test (debugging).
  keep_profile: false

timeouts:
  page_load: 30     # seconds, page load timeout of web.open
  default: 10       # default explicit wait
  action: 5         # a click / typing waits this long for its element to be visible, still and enabled
  command: 30       # any single command to the page; a page blocked by a modal browser UI fails after it
  long: 30          # downloads, heavy pages
  poll: 0.2         # poll interval for waits
  native: 10        # pywinauto window/dialog waits

paths:
  artifacts: artifacts            # everything a run or a tool writes (git-ignored)
  results: artifacts/test-results # the latest test run only: emptied when a run starts
  cases: tests/features           # test case documents (<feature>/*.md, next to their tests)
  data: resources/data            # <name>.yaml test data (bookmark seeds, add-on ids ...)
  extensions: resources/extensions  # sample add-ons (unpacked folders)
  profiles: resources/profiles    # profile templates for @browser(profile=...)
  site: resources/site            # static pages served by the local HTTP server

server:
  host: 127.0.0.1
  port: 0                     # 0 = random free port

# Internal pages. The address bar SHOWS internet://bookmarks, but navigation over DevTools
# only accepts chrome://bookmarks (web.open("internet://...") stays on about:blank).
# Typing internet://... into the omnibox (native.navigate) works too.
pages:
  scheme: chrome
  display_scheme: internet
  bookmarks: bookmarks
  history: history
  downloads: downloads
  settings: settings
  extensions: extensions
  newtab: newtab
  version: version
  flags: flags

# Chrome Web Store (add-on install from the store; needs internet through the proxy)
webstore:
  item_url: "https://chromewebstore.google.com/detail/{id}"
  # visible text of the install / remove button - Samsung may rebrand it
  # (the store shows "Install" on some item pages, "Add to Chrome" on others)
  add_button_texts: ["Add to Chrome", "Install", "Add to Samsung Internet", "Add to browser"]
  remove_button_texts: ["Remove from Chrome", "Uninstall", "Remove from Samsung Internet", "Remove from browser"]

native:
  # Enable pywinauto based checks (auto-disabled on non-Windows).
  enabled: true
  backend: uia
  # Logical name -> UIA criteria of the browser's own UI (toolbar, menus, bubbles, dialogs).
  ui_map: config/native_ui.yaml
  # seconds after a browser start during which native actions first close a startup bubble
  # (startup_bubbles in the ui map) that has shown up; nothing waits for it
  startup_bubble_watch: 10

report:
  screenshot_on_failure: true
  # red outline on the element the failing step was using (visible in page.png)
  highlight_on_failure: true
  dom_on_failure: true
  # screen.png / result pictures on Windows: window = only the browser's windows (frame,
  # bubbles, menus, its Save As/Open dialogs), other apps and monitors left out;
  # screen = every monitor (to also see File Explorer or Windows notifications)
  screen_capture: window
  uia_on_failure: true
  # a picture before every interaction (target framed in red) + one per step (flag: --screenshot-steps)
  screenshot_steps: false
  # a video per test instead of pictures: browser windows, step caption, framed interactions
  # (videos/<test>.mp4, in the report; shared like the step pictures; flag: --record).
  # Where the screen cannot be recorded (headless, not Windows) the current tab is recorded.
  record_video: false
  # Playwright trace per test (traces/<test>.zip: every web action with DOM snapshots,
  # screenshots, console and network): off | failed (failed tests only) | all
  # (flag: run.py --trace, pytest --pw-trace)
  # Open one: python -m playwright show-trace <file>  (or drop it on trace.playwright.dev)
  trace: off
  # cases whose videos / step pictures go in the files shared on Confluence or Jira
  # (share/attachments/): failed (failed/error cases only), all, none
  # (a full run with step pictures is ~280 pictures / ~22 MB; flag: --share-media)
  share_media: failed

# Company proxy. The browser uses the Windows system proxy by default; set
# browser_proxy only to force one.
network:
  browser_proxy: ""             # e.g. http://proxy.company.com:8080
  proxy_bypass: "127.0.0.1;localhost;<local>"
